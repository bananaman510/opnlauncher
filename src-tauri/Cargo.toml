[package]
name = "opnlauncher"
version = "0.1.0"
description = "A local-first Minecraft Java Edition launcher"
authors = ["OpnLauncher contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[lib]
name = "opnlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opnlauncher"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "dev-offline-profiles"]
desktop = ["dep:tauri"]
dev-offline-profiles = []

[dependencies]
directories = "6.0"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
thiserror = "2.0"
tauri = { version = "2", optional = true }
uuid = { version = "1.18", features = ["v3", "v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
